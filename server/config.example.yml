# Example LuxonServer configuration for Reloaded.
# This is a template only. Do not expose it publicly until the
# original client's protocol and transport have been verified.

Servers:
  NameServer:
    - port: 5058
      external_address: YOUR_HOST:5058
    - port: 27000
      external_address: YOUR_HOST:27000

  MasterServer:
    - port: 5055
      external_address: YOUR_HOST:5055
    - port: 27001
      external_address: YOUR_HOST:27001

  GameServer:
    - port: 5056
      external_address: YOUR_HOST:5056
    - port: 27002
      external_address: YOUR_HOST:27002

MaxConnections: 100
MaxGamePeers: 16
TickTimeBudget: 2000

HTTP:
  enabled: true
  address: 127.0.0.1
  port: 5088
