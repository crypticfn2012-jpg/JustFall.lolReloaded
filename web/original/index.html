<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JustFall.lol Reloaded — Play</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{font-family:Arial,sans-serif}#gameContainer{position:fixed;inset:0;background:#000}#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080909;color:#fff;transition:opacity .35s}.loading-box{text-align:center}.loading-title{font:800 30px Arial,sans-serif;letter-spacing:1px}.loading-title span{color:#b8ff3d}.loading-sub{margin-top:10px;color:#737770;font-size:10px;letter-spacing:1.5px}.bar{width:230px;height:3px;background:#202220;margin:24px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#b8ff3d;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(700%)}}#back{position:fixed;z-index:30;left:18px;top:18px;padding:9px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.78);color:#fff;text-decoration:none;font:700 10px Arial;letter-spacing:1px;opacity:.8}#back:hover{opacity:1}
</style>
<script>
(function(){
  const NativeWebSocket=window.WebSocket;
  const params=new URLSearchParams(location.search);
  const bridge=params.get("server")||"wss://justfall-lolreloaded.justfalllol.blitz.cloud/ws";
  class ReloadedWebSocket extends NativeWebSocket{
    constructor(url,protocols){
      const target=new URL(bridge);
      const original=String(url);
      if(/^wss?:\/\//i.test(original)){
        try{target.search=new URL(original).search}catch(e){}
      }
      super(target.toString(),protocols);
    }
  }
  window.WebSocket=ReloadedWebSocket;
  window.RELOADED_PHOTON_WS=bridge;
})();
</script>
<script>
window.showAds = window.showAds || function(){};
window.hideAds = window.hideAds || function(){};
</script>
<script src="https://cdn.jsdelivr.net/gh/D3ch/hell@e1ef9902521cfadf702a3bea91ccaeb1684c0f0f/Games/just-fall/UnityLoader.js"></script>
</head>
<body>
<div id="gameContainer"></div>
<div id="loading"><div class="loading-box"><div class="loading-title">JUSTFALL<span>.LOL</span></div><div class="loading-sub">LOADING ORIGINAL UNITY CLIENT</div><div class="bar"><i></i></div></div></div>
<a id="back" href="https://crypticfn2012-jpg.github.io/JustFall.lolReloaded">← SITE</a>
<script>
const ORIGINAL="https://cdn.jsdelivr.net/gh/D3ch/hell@e1ef9902521cfadf702a3bea91ccaeb1684c0f0f/Games/just-fall/WebGL.json";
UnityLoader.instantiate("gameContainer",ORIGINAL,{
  onProgress:function(_,progress){
    if(progress>=1){
      const el=document.getElementById("loading");
      el.style.opacity="0";
      setTimeout(function(){el.remove()},400);
    }
  }
});
</script>
</body>
</html>
