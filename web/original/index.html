<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JustFall.lol Reloaded — Play</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{font-family:Arial,sans-serif}#gameContainer{position:fixed;inset:0;background:#000}#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080909;color:#fff;transition:opacity .35s}.loading-box{text-align:center}.loading-title{font:800 30px Arial,sans-serif;letter-spacing:1px}.loading-title span{color:#729ee0}.loading-sub{margin-top:10px;color:#737770;font-size:10px;letter-spacing:1.5px}.bar{width:230px;height:3px;background:#202220;margin:24px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:#5a80c5;animation:load 1.1s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(700%)}}#back{position:fixed;z-index:30;left:18px;top:18px;padding:9px 12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.78);color:#fff;text-decoration:none;font:700 10px Arial;letter-spacing:1px;opacity:.8}#back:hover{opacity:1}
</style>
<script>
(function(){
  const NativeWebSocket = window.WebSocket;
  const params = new URLSearchParams(window.location.search);
  const bridge = params.get("server") || "wss://justfall-lolreloaded.justfalllol.blitz.cloud/ws";

  function rewriteUrl(url){
    const original = String(url);
    if(!/^wss?:\/\//i.test(original)) return original;

    try{
      const source = new URL(original);
      const target = new URL(bridge);

      // Keep Photon query parameters (app, clientversion, sid, etc.) but
      // force the connection itself to our replacement WSS endpoint.
      target.search = source.search;
      return target.toString();
    }catch(e){
      console.error("[JustFall Reloaded] WebSocket URL rewrite failed", e);
      return bridge;
    }
  }

  // Proxy the native constructor instead of subclassing it. Unity's WebGL
  // networking code expects the exact browser WebSocket constructor semantics.
  const ReloadedWebSocket = new Proxy(NativeWebSocket, {
    construct(target, args){
      const originalUrl = args[0];
      const rewrittenUrl = rewriteUrl(originalUrl);
      const nextArgs = [rewrittenUrl].concat(args.slice(1));

      console.log(
        "[JustFall Reloaded] WS ROUTE:",
        String(originalUrl),
        "=>",
        rewrittenUrl
      );

      return Reflect.construct(target, nextArgs, target);
    }
  });

  window.WebSocket = ReloadedWebSocket;
  window.globalThis.WebSocket = ReloadedWebSocket;
  window.RELOADED_PHOTON_WS = bridge;

  window.JustFallReloaded = {
    bridge: bridge,
    socketCount: 0,
    sockets: [],
    log: function(type, data){
      var entry = {
        time:new Date().toISOString(),
        type:type,
        data:data==null?null:data
      };
      this.debugLog.push(entry);
      console.log("[JustFall Reloaded]", type, data==null?"":data);
      this.renderDebug();
    },
    debugLog: [],
    renderDebug: function(){
      var box=document.getElementById("connection-debug");
      if(!box) return;
      var rows=this.debugLog.slice(-12).map(function(x){
        return "<div><b>"+x.type+"</b> "+String(x.data==null?"":x.data)
          .replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>";
      }).join("");
      box.innerHTML=rows;
    },
    send: function(objectName, methodName, value){
      if(window.gameInstance && typeof window.gameInstance.SendMessage==="function"){
        window.gameInstance.SendMessage(
          objectName,
          methodName,
          value == null ? "" : String(value)
        );
        this.log("unity.send", objectName+"."+methodName);
        return true;
      }
      this.log("unity.error","Unity instance is not ready");
      return false;
    }
  };

  window.JustFallReloaded.log("ws.hook",
    "active; bridge="+bridge+" native="+(typeof NativeWebSocket));
})();
</script>
<script>
window.showAds = window.showAds || function(){};
window.hideAds = window.hideAds || function(){};
</script>
<script src="./UnityLoader.js"></script>
</head>
<body>
<div id="gameContainer"></div>
<div id="loading"><div class="loading-box"><div class="loading-title">JUSTFALL<span>.LOL</span></div><div class="loading-sub">LOADING ORIGINAL GAME</div><div class="bar"><i></i></div></div></div>
<div id="connection-debug" style="position:fixed;right:10px;bottom:10px;z-index:50;max-width:520px;max-height:190px;overflow:auto;padding:9px 11px;background:rgba(0,0,0,.82);color:#b9d8ff;border:1px solid rgba(255,255,255,.14);font:11px/1.5 monospace;pointer-events:none"></div>
<a id="back" href="https://crypticfn2012-jpg.github.io/JustFall.lolReloaded">← SITE</a>
<script>
const ORIGINAL="./WebGL.json";
window.JustFallReloaded.log("loader","UnityLoader="+(typeof UnityLoader)+"; Using "+new URL(ORIGINAL,location.href).href);
window.gameInstance=UnityLoader.instantiate("gameContainer",ORIGINAL,{
  onProgress:function(_,progress){
    window.JustFallReloaded.log("unity.progress",Math.round(progress*100)+"%");
    if(progress>=1){
      const el=document.getElementById("loading");
      el.style.opacity="0";
      setTimeout(function(){el.remove()},400);
    }
  }
});
window.JustFallReloaded.log("loader","UnityLoader.instantiate called");
</script>
</body>
</html>
