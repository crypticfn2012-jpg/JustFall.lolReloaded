name: JustFall Reloaded CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public site
        run: |
          test -f index.html
          test -f web/style.css
          test -f web/original/index.html

      - name: Install bridge dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Syntax check bridge
        working-directory: server
        run: node --check render_bridge.js

      - name: Test Photon WSS transport
        run: node server/test_bridge.js

      - name: Check deployment files
        run: |
          test -f Dockerfile
          test -f server/blitz_start.sh
          test -f server/render_bridge.js
          test -f server/photon/patch_server.py

      - name: Build Blitz image
        run: docker build -t justfall-blitz-test .

      - name: Check root deployment files
        run: |
          test -f Dockerfile
          test -f server/blitz_start.sh
          test -f server/render_bridge.js
          grep -q "JustFallAdsDisabled" web/original/index.html

      - name: Smoke test Blitz container
        run: |
          set -e
          docker run -d --name justfall-smoke \
            -e PORT=8080 \
            -e PHOTON_PORT=27001 \
            -p 18080:8080 \
            -p 27001:27001/udp \
            justfall-blitz-test

          cleanup() {
            docker logs justfall-smoke || true
            docker rm -f justfall-smoke || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/health.json; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' justfall-smoke 2>/dev/null || true)" != "true" ]; then
              echo "Container exited before health endpoint became ready"
              docker logs justfall-smoke || true
              exit 1
            fi
            sleep 1
          done

          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' justfall-smoke)" = "true"
          curl -fsS http://127.0.0.1:18080/health >/tmp/health-after-start.json
          grep -q '"ok":true' /tmp/health-after-start.json
          docker logs justfall-smoke 2>&1 | grep -q "Photon process is running"
          docker logs justfall-smoke 2>&1 | grep -q "\[Bootstrap\] PhotonServer constructed"
          docker logs justfall-smoke 2>&1 | grep -q "\[Server\] Photon UDP server listening"
