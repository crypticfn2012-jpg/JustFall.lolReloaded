name: JustFall Reloaded CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public site
        run: |
          test -f index.html
          test -f web/style.css
          test -f web/original/index.html

      - name: Install bridge dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Syntax check bridge
        working-directory: server
        run: node --check photon_ws_bridge.js

      - name: Test Photon WSS transport
        run: node server/test_bridge.js

      - name: Check deployment files
        run: |
          test -f server/bridge.Dockerfile
          test -f server/photon/Dockerfile
          test -f server/photon_entrypoint.sh
          test -f server/photon/patch_server.py
          test -f render.yaml

      - name: Build WSS bridge image
        run: docker build -f server/bridge.Dockerfile -t justfall-ws-test .

      - name: Build Photon relay image
        run: docker build -f server/photon/Dockerfile -t justfall-photon-test .
