name: JustFall Reloaded CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public site
        run: |
          test -f index.html
          test -f web/style.css
          test -f web/original/index.html

      - name: Install bridge dependencies
        working-directory: server
        run: npm install --ignore-scripts

      - name: Syntax check bridge
        working-directory: server
        run: node --check render_bridge.js

      - name: Test Photon WSS transport
        run: node server/test_bridge.js

      - name: Check deployment files
        run: |
          test -f Dockerfile
          test -f server/blitz_start.sh
          test -f server/render_bridge.js
          test -f server/photon/patch_server.py

      - name: Build Blitz image
        run: docker build -t justfall-blitz-test .

      - name: Check root deployment files
        run: |
          test -f Dockerfile
          test -f server/blitz_start.sh
          test -f server/render_bridge.js
