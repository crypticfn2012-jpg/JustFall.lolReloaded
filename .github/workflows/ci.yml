name: Penguin Plunge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: penguin-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check site files
        run: |
          test -f index.html
          test -f favicon.png
          test -f web/style.css
          test -s index.html
          test -s web/style.css

      - name: Check Penguin Plunge branding
        run: |
          grep -qi "Penguin Plunge" index.html
          grep -qi "Penguin Plunge" README.md
          ! grep -qi "JustFall" index.html

      - name: Validate HTML references
        run: |
          grep -q 'href="web/style.css"' index.html
          grep -q 'href="favicon.png"' index.html

      - name: Check no broken local references
        run: |
          test -f web/style.css
          test -f favicon.png

      - name: Validate Pages workflow
        run: |
          test -f .github/workflows/pages.yml
          grep -q "actions/upload-pages-artifact@v3" .github/workflows/pages.yml
          grep -q "actions/deploy-pages@v4" .github/workflows/pages.yml

      - name: CI passed
        run: echo "Penguin Plunge site checks passed"
