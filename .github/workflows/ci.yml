name: JustFall Reloaded CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check public site
        run: |
          test -f web/index.html
          test -f web/style.css
          test -f web/original/index.html

      - name: Check bridge package
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Syntax check bridge
        run: node --check photon_ws_bridge.js

      - name: Check server deployment files
        run: |
          test -f server/bridge.Dockerfile
          test -f server/photon/Dockerfile
          test -f server/photon_entrypoint.sh
          test -f render.yaml
